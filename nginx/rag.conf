# portfolio-web, port 80: the RAG UI (rag.), a static Next export. /api/* is routed to portfolio-api by the edge
# (Traefik: Host(rag.rangeltech.net) && PathPrefix(/api) -> portfolio-api), never served from here.
server {
    listen 80;
    server_name rag.rangeltech.net;
    server_tokens off;

    root /usr/share/nginx/rag;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    location ^~ /api/ { return 404; }

    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /404.html { internal; }
    error_page 404 /404.html;
}
