# portfolio-web, port 80: the site (lucas.), selected by the Host header that Traefik forwards, plus a catch-all
# default server so health checks work with any Host (Docker's own probe uses 127.0.0.1).
# The rag. host lives in rag.conf (same port); the bi. proxy in bi.conf (port 8081).
# TLS, security headers (CSP, HSTS) and rate limits are the edge proxy's job, not this file's.

# Catch-all: /healthz for any Host, nothing else.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 404; }
}

# Dedicated health port (contract compatibility): /healthz on 8080, nothing else.
server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 404; }
}

server {
    listen 80;
    server_name lucas.rangeltech.net;
    server_tokens off;

    root /usr/share/nginx/site;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

    # /api/* is routed to portfolio-api by the edge (Traefik PathPrefix); never served from here.
    location ^~ /api/ { return 404; }

    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /404.html { internal; }
    error_page 404 /404.html;
}
