# Static file server for the site's own export. No proxying, no upstream: the
# private reverse proxy handles TLS and the public domain, outside this repo.
server {
    listen 8080;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Next.js's static export inlines its hydration payload as <script> JSON, which needs
    # 'unsafe-inline' here; the site takes no user input and reflects nothing into the page,
    # so there is no injection surface for this directive to guard against.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    error_page 404 /404.html;
}
